# Lychee link checker configuration
# https://lychee.cli.rs/usage/config/

# Accept these status codes as valid (some services return 403/429 for bots)
accept = [200, 204, 301, 302, 403, 429]

# Exclude URLs that are known to rate-limit or block CI bots
exclude = [
    # Visitor counter - intermittently unavailable
    "count\\.getloli\\.com",
    # GitHub readme stats - rate limited on GitHub Actions
    "github-readme-stats\\.vercel\\.app",
]

# Timeout per request (seconds)
timeout = 30

# Max concurrent requests
max_concurrency = 4
